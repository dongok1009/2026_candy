name: LiveSignalBotV600
on:
  workflow_dispatch: # 오직 수동 테스트 실행 시에만 버튼 클릭으로 1회성 가동 허용 (자동 스케줄 영구 정지)

concurrency:
  group: global-live-bot
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install axios dotenv ccxt
      - name: Run V600 Monitoring Bot (Persistent)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STRATEGY_VERSION: 'Logic.v8.2.0.cjs'
          TARGET_NET_ROI: '0.04'
          LEVERAGE: '5'
        run: node src/v600_live_bot.cjs
